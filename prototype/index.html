<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wanderer's Orrery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #05070d;
    --void-2: #0a0f1c;
    --panel: #0e1526;
    --line: #23324d;
    --gold: #d9a95f;
    --cyan: #6fd3c7;
    --text: #dfe6f2;
    --text-dim: #7d8ba3;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--void);
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
  }
  #scene{ position:fixed; inset:0; }
  canvas{ display:block; }

  .veil{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: var(--void);
    z-index: 50;
    transition: opacity 0.9s ease;
  }
  .veil.hide{ opacity:0; pointer-events:none; }
  .veil-text{
    font-family:'Space Mono', monospace;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.15em;
  }

  header{
    position:fixed; top:0; left:0; right:0;
    padding: 28px 36px 18px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
    z-index: 10;
    background: linear-gradient(to bottom, rgba(5,7,13,0.85), transparent);
  }
  h1{
    margin:0; font-weight:600; font-size: 26px; letter-spacing: 0.02em;
    color: var(--text);
  }
  h1 em{ color: var(--gold); font-style: italic; }
  .subtitle{
    margin: 4px 0 0; font-size: 13px; color: var(--text-dim);
    font-family:'Space Mono', monospace; letter-spacing: 0.04em;
  }

  .controls{
    position:fixed; bottom: 26px; left: 36px;
    display:flex; align-items:center; gap: 14px;
    font-family:'Space Mono', monospace;
    z-index: 10;
  }
  .btn{
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(14,21,38,0.7);
    color: var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size: 14px;
    backdrop-filter: blur(6px);
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .btn:hover{ border-color: var(--gold); transform: scale(1.06); }

  .speed{
    display:flex; align-items:center; gap:10px;
    background: rgba(14,21,38,0.7);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 8px 16px;
    backdrop-filter: blur(6px);
  }
  .speed span{ font-size: 11px; color: var(--text-dim); letter-spacing: 0.05em; }
  input[type=range]{
    -webkit-appearance: none;
    width: 110px; height: 2px; background: var(--line);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--gold); cursor:pointer;
  }

  .legend{
    position:fixed; bottom: 26px; right: 36px;
    font-family:'Space Mono', monospace;
    font-size: 10.5px; color: var(--text-dim);
    text-align:right; line-height: 1.6;
    z-index: 10;
    letter-spacing: 0.03em;
  }

  #panel{
    position:fixed; top: 0; right: -340px;
    width: 300px; height: 100%;
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding: 100px 34px 34px;
    transition: right 0.5s cubic-bezier(.2,.8,.2,1);
    z-index: 20;
    overflow-y:auto;
  }
  #panel.open{ right: 0; }
  #panel .close{
    position:absolute; top: 28px; right: 30px;
    cursor:pointer; color: var(--text-dim);
    font-family:'Space Mono', monospace; font-size:12px;
    border:1px solid var(--line); border-radius:50%;
    width:28px; height:28px; display:flex; align-items:center; justify-content:center;
  }
  #panel .close:hover{ color: var(--text); border-color: var(--gold); }
  #panel .name{
    font-size: 34px; font-weight:600; margin: 0 0 2px;
    color: var(--gold);
  }
  #panel .kind{
    font-family:'Space Mono', monospace; font-size: 11px;
    color: var(--cyan); letter-spacing: 0.08em; margin-bottom: 22px;
  }
  #panel .fact{
    display:flex; justify-content:space-between;
    padding: 10px 0; border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  #panel .fact .k{ color: var(--text-dim); font-family:'Space Mono', monospace; font-size: 10.5px; }
  #panel .fact .v{ text-align:right; }
  #panel .blurb{
    margin-top: 22px; font-size: 15.5px; line-height: 1.6; font-style: italic;
    color: var(--text);
  }

  @media (max-width: 640px){
    header{ padding: 20px 20px 14px; }
    h1{ font-size:20px; }
    .legend{ display:none; }
    .controls{ left: 20px; bottom: 20px; }
    #panel{ width: 82%; padding: 90px 24px 24px; }
  }
</style>
</head>
<body>

<div class="veil" id="veil"><div class="veil-text">CALIBRATING ORBITS…</div></div>

<header>
  <div>
    <h1>The Wanderer's <em>Orrery</em></h1>
    <div class="subtitle">a scale-broken tour of the solar system — drag to orbit, scroll to zoom, click a body</div>
  </div>
</header>

<div class="controls">
  <div class="btn" id="playPause" title="Pause/Play">❙❙</div>
  <div class="speed">
    <span>TIME</span>
    <input type="range" id="speedSlider" min="0" max="5" step="0.1" value="1">
  </div>
</div>

<div class="legend">
  scroll · zoom<br>
  drag · rotate<br>
  click · inspect
</div>

<div id="panel">
  <div class="close" id="closePanel">✕</div>
  <div class="name" id="pName">—</div>
  <div class="kind" id="pKind">—</div>
  <div id="pFacts"></div>
  <div class="blurb" id="pBlurb"></div>
</div>

<div id="scene"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  const container = document.getElementById('scene');
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 4000);
  camera.position.set(0, 90, 210);

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 20;
  controls.maxDistance = 900;

  // ---------- Starfield ----------
  function makeStars(count, radius, size, color){
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(count*3);
    for(let i=0;i<count;i++){
      const r = radius * (0.6 + Math.random()*0.4);
      const theta = Math.random()*Math.PI*2;
      const phi = Math.acos((Math.random()*2)-1);
      positions[i*3]   = r*Math.sin(phi)*Math.cos(theta);
      positions[i*3+1] = r*Math.cos(phi);
      positions[i*3+2] = r*Math.sin(phi)*Math.sin(theta);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    const mat = new THREE.PointsMaterial({ color: color, size: size, sizeAttenuation:true, transparent:true, opacity:0.85 });
    return new THREE.Points(geo, mat);
  }
  scene.add(makeStars(3200, 1600, 1.1, 0xffffff));
  scene.add(makeStars(900, 1200, 1.8, 0x9fbfff));
  scene.add(makeStars(260, 900, 2.6, 0xffdca8));

  // ---------- Lighting ----------
  scene.add(new THREE.AmbientLight(0x223355, 0.55));
  const sunLight = new THREE.PointLight(0xfff3d6, 3.4, 2000, 1.6);
  scene.add(sunLight);

  // ---------- Sun ----------
  const sunGeo = new THREE.SphereGeometry(9, 48, 48);
  const sunMat = new THREE.MeshBasicMaterial({ color: 0xffd27a });
  const sun = new THREE.Mesh(sunGeo, sunMat);
  scene.add(sun);

  const glowGeo = new THREE.SphereGeometry(12.5, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xffb347, transparent:true, opacity:0.22 });
  sun.add(new THREE.Mesh(glowGeo, glowMat));
  const glowGeo2 = new THREE.SphereGeometry(17, 32, 32);
  const glowMat2 = new THREE.MeshBasicMaterial({ color: 0xff9a3c, transparent:true, opacity:0.10 });
  sun.add(new THREE.Mesh(glowGeo2, glowMat2));

  // ---------- Orbit ring helper ----------
  function makeOrbitRing(radius){
    const curve = new THREE.EllipseCurve(0,0, radius, radius, 0, Math.PI*2, false, 0);
    const points = curve.getPoints(128);
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({ color: 0x30425f, transparent:true, opacity:0.55 });
    const ring = new THREE.LineLoop(geo, mat);
    ring.rotation.x = Math.PI/2;
    return ring;
  }

  // ---------- Planet data (radii/distances are scale-broken for visual clarity) ----------
  const planetData = [
    { name:'Mercury', kind:'Terrestrial planet', dist:20, size:1.1, color:0xb2a48f, speed:4.15,
      facts:{ 'Diameter':'4,879 km','Day length':'59 Earth days','Year length':'88 Earth days','Moons':'0','Avg. temp':'167°C' },
      blurb:'The closest world to the Sun, scorched by day and frozen by night, with almost no atmosphere to hold the warmth in between.' },
    { name:'Venus', kind:'Terrestrial planet', dist:28, size:1.7, color:0xe0c39a, speed:1.62,
      facts:{ 'Diameter':'12,104 km','Day length':'243 Earth days','Year length':'225 Earth days','Moons':'0','Avg. temp':'464°C' },
      blurb:'Wrapped in thick, acidic clouds that trap heat so effectively it is the hottest planet, despite not being the closest to the Sun.' },
    { name:'Earth', kind:'Terrestrial planet', dist:37, size:1.8, color:0x4c86c9, speed:1.0, moon:true,
      facts:{ 'Diameter':'12,742 km','Day length':'24 hours','Year length':'365.25 days','Moons':'1','Avg. temp':'15°C' },
      blurb:'The only known world with liquid water on its surface, a breathable sky, and — so far — anyone to notice either.' },
    { name:'Mars', kind:'Terrestrial planet', dist:48, size:1.4, color:0xc1603f, speed:0.53,
      facts:{ 'Diameter':'6,779 km','Day length':'24h 37m','Year length':'687 Earth days','Moons':'2','Avg. temp':'-63°C' },
      blurb:'A rust-red desert world with the largest volcano and canyon in the solar system, and dust storms that can swallow it whole.' },
    { name:'Jupiter', kind:'Gas giant', dist:68, size:5.4, color:0xd9b48f, speed:0.084,
      facts:{ 'Diameter':'139,820 km','Day length':'9h 56m','Year length':'12 Earth years','Moons':'95+','Avg. temp':'-108°C' },
      blurb:'A world with no solid ground at all — just deepening bands of storm cloud, and a red spot wider than Earth that has raged for centuries.' },
    { name:'Saturn', kind:'Gas giant', dist:92, size:4.6, color:0xe3d2a3, speed:0.034, rings:true,
      facts:{ 'Diameter':'116,460 km','Day length':'10h 42m','Year length':'29 Earth years','Moons':'146+','Avg. temp':'-139°C' },
      blurb:'Famous for rings made of countless icy fragments — some the size of dust, others the size of houses — locked in their own thin orbit.' },
    { name:'Uranus', kind:'Ice giant', dist:114, size:3.0, color:0x9fd8d1, speed:0.012,
      facts:{ 'Diameter':'50,724 km','Day length':'17h 14m','Year length':'84 Earth years','Moons':'28','Avg. temp':'-197°C' },
      blurb:'Tipped almost completely on its side, so each pole spends 21 years in darkness, then 21 years facing the distant Sun.' },
    { name:'Neptune', kind:'Ice giant', dist:134, size:2.9, color:0x5169d6, speed:0.006,
      facts:{ 'Diameter':'49,244 km','Day length':'16h 6m','Year length':'165 Earth years','Moons':'16','Avg. temp':'-201°C' },
      blurb:'The windiest world known, with supersonic gales, and so far from the Sun that noon there looks like a deep twilight.' },
  ];

  const planets = [];
  planetData.forEach(p => {
    scene.add(makeOrbitRing(p.dist));

    const pivot = new THREE.Object3D();
    pivot.rotation.y = Math.random()*Math.PI*2;
    scene.add(pivot);

    const geo = new THREE.SphereGeometry(p.size, 32, 32);
    const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness:0.85, metalness:0.05 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.x = p.dist;
    mesh.userData = p;
    pivot.add(mesh);

    if(p.rings){
      const ringGeo = new THREE.RingGeometry(p.size*1.5, p.size*2.6, 64);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xcbb98a, side: THREE.DoubleSide, transparent:true, opacity:0.75 });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.rotation.x = Math.PI/2.3;
      mesh.add(ringMesh);
    }
    if(p.moon){
      const moonPivot = new THREE.Object3D();
      mesh.add(moonPivot);
      const moonGeo = new THREE.SphereGeometry(0.45, 16, 16);
      const moonMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness:0.9 });
      const moonMesh = new THREE.Mesh(moonGeo, moonMat);
      moonMesh.position.x = p.size + 1.6;
      moonPivot.add(moonMesh);
      p._moonPivot = moonPivot;
    }

    p._pivot = pivot;
    p._mesh = mesh;
    planets.push(p);
  });

  // ---------- Asteroid belt ----------
  const beltGroup = new THREE.Group();
  const beltGeo = new THREE.IcosahedronGeometry(0.28, 0);
  const beltMat = new THREE.MeshStandardMaterial({ color: 0x8b8579, roughness:1 });
  for(let i=0;i<260;i++){
    const r = 56 + Math.random()*7;
    const a = Math.random()*Math.PI*2;
    const m = new THREE.Mesh(beltGeo, beltMat);
    m.position.set(Math.cos(a)*r, (Math.random()-0.5)*1.6, Math.sin(a)*r);
    m.scale.setScalar(0.5 + Math.random()*1.4);
    beltGroup.add(m);
  }
  scene.add(beltGroup);

  // ---------- Raycasting / selection ----------
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let selected = null;

  function showPanel(p){
    document.getElementById('pName').textContent = p.name;
    document.getElementById('pKind').textContent = p.kind;
    document.getElementById('pBlurb').textContent = p.blurb;
    const factsEl = document.getElementById('pFacts');
    factsEl.innerHTML = '';
    Object.entries(p.facts).forEach(([k,v])=>{
      const row = document.createElement('div');
      row.className = 'fact';
      row.innerHTML = `<span class="k">${k.toUpperCase()}</span><span class="v">${v}</span>`;
      factsEl.appendChild(row);
    });
    document.getElementById('panel').classList.add('open');
  }
  document.getElementById('closePanel').onclick = () => document.getElementById('panel').classList.remove('open');

  function onClick(e){
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left)/rect.width)*2 - 1;
    mouse.y = -((e.clientY - rect.top)/rect.height)*2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const meshes = planets.map(p=>p._mesh);
    const hits = raycaster.intersectObjects(meshes);
    if(hits.length){
      showPanel(hits[0].object.userData);
    }
  }
  renderer.domElement.addEventListener('click', onClick);

  // ---------- Controls: play/pause + speed ----------
  let playing = true;
  let speedMult = 1;
  document.getElementById('playPause').onclick = function(){
    playing = !playing;
    this.textContent = playing ? '❙❙' : '▶';
  };
  document.getElementById('speedSlider').oninput = function(e){
    speedMult = parseFloat(e.target.value);
  };

  // ---------- Resize ----------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- Animate ----------
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    if(playing){
      const t = dt * speedMult;
      sun.rotation.y += t*0.05;
      beltGroup.rotation.y += t*0.02;
      planets.forEach(p => {
        p._pivot.rotation.y += t * p.speed * 0.3;
        p._mesh.rotation.y += t * 0.8;
        if(p._moonPivot) p._moonPivot.rotation.y += t * 2.2;
      });
    }
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // ---------- Reveal ----------
  setTimeout(()=> document.getElementById('veil').classList.add('hide'), 600);
})();
</script>
</body>
</html>
